# Extended arbtest budget after merge. Core CI is in ci.yml.

name: Post merge

on:
  push:
    branches: [main]

env:
  # codec-corpus is not provisioned in CI; corpus-backed feature tests skip
  # EXPLICITLY via this flag (without it they fail loudly — no silent skips).
  # Same setting as ci.yml: this run has been red since the skips became
  # explicit (f1faec70) because it lacked the flag.
  ZENJXL_ALLOW_MISSING_CORPUS: "1"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Superseded runs only waste runner queue — particularly the macOS
# jobs, which wait on GitHub's scarcest pool. Only the newest
# commit's run matters per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arbtest-extended:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run arbtest with extended budget
        env:
          ARBTEST_BUDGET_MS: 100000
        run: cargo test --release --all --no-fail-fast --all-features
