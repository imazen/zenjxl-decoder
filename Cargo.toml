[profile.release]
debug = true
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.bench]
debug = true
lto = "thin"
codegen-units = 1

[workspace]
members = ["zenjxl-decoder", "zenjxl-decoder-cli", "zenjxl-decoder-macros", "zenjxl-decoder-simd"]
# `apidoc/` is the CI-free public-API snapshot runner: excluded so plain
# `cargo test` and every CI job never compile its dependency tree or run
# rustdoc. Regenerate via `just api-doc`.
exclude = ["apidoc"]
resolver = "2"

[workspace.lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
