[package]
name = "zenjxl-decoder"
description = "High performance Rust implementation of a JPEG XL decoder"
version = "0.4.0"
readme = "../README.crates.md"
keywords = ["jpeg-xl", "decoder"]
categories = ["multimedia::images"]
authors = ["Luca Versari <veluca93@gmail.com>", "Lilith River <lilith@imazen.io>"]
repository = "https://github.com/imazen/zenjxl-decoder"
edition = "2024"
rust-version = "1.89"
license = "BSD-3-Clause"

include = ["/src/**", "/tests/**", "/benches/**", "/examples/**", "/LICENSE*"]

[dependencies]
thiserror = "2.0.20"
whereat = "0.1.5"
byteorder = "1.5.0"
num-derive = "0.5.1"
num-traits = "0.2.19"
array-init = "2.1.0"
tracing = { version = "0.1.44", optional = true }
jxl_macros = { package = "zenjxl-decoder-macros", path = "../zenjxl-decoder-macros", version = "=0.3.9" }
jxl_simd = { package = "zenjxl-decoder-simd", path = "../zenjxl-decoder-simd", version = "=0.3.9" }
moxcms = { version = ">=0.8.1, <0.10", optional = true, features = ["extended_range", "options"] }
rayon = { version = "1.12.0", optional = true }
aligned-vec = "0.6.4"
bytemuck = { version = "1.25.2", features = ["derive"] }
atomic_refcell = "0.1.14"
smallvec = "1.16.2"
enough = { version = "0.4.4", features = ["std"] }
brotli = { version = "9.0.0", default-features = false, features = ["std"], optional = true }
paste = "1.0.15"

[dev-dependencies]
# `testable_dispatch` lets tests/cross_tier_determinism.rs disable SIMD tokens
# at runtime even where the target guarantees them at compile time (NEON on
# aarch64), so the differential decode really visits every tier. Dev-only: it
# is not enabled for library builds.
archmage = { version = ">=0.9.29, <=0.9.31-beta.1", features = ["testable_dispatch"] }
arbtest = "0.3.2"
zenutils-fuzz = "0.1.0"
png = "0.18.1"
rand = "0.10.3"
rand_chacha = "0.10.0"
rand_xorshift = "0.5.0"
almost-enough = { version = "0.4.4", features = ["std"] }
serde_json = "1.0.151"
test-log = { version = "0.2.21", features = ["trace"] }
jxl_macros = { package = "zenjxl-decoder-macros", path = "../zenjxl-decoder-macros", version = "=0.3.9", features = ["test"] }
zenbench = { version = "0.1.10"}

# Download-on-demand test fixtures. `resources/test/` (~31 MB) is not packaged
# in the published crate, so its tests fetch fixtures at runtime via codec-corpus
# (issue #8). Not needed on wasm, where the fixture tests don't run.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
codec-corpus = "1.1.0"
# criterion pulls in rayon, which does not build for wasm32-wasip1; only
# `tf_bench` uses it (the other benches are zenbench).
criterion = { version = "0.8.2", features = ["html_reports"] }

[features]
default = ["all-simd"]

all-simd = ["jxl_simd/all-simd", "sse42", "avx", "avx512", "neon", "wasm128"]
profiling = []
sse42 = ["jxl_simd/sse42"]
avx = ["jxl_simd/avx"]
avx512 = ["jxl_simd/avx512"]
neon = ["jxl_simd/neon"]
wasm128 = ["jxl_simd/wasm128"]
cms = ["moxcms"]
jpeg = ["dep:brotli"]
allow-unsafe = []
# Dev-only: re-exports the pub(crate) transform kernels so benches/kernel_tiers.rs
# can instantiate them against each SIMD descriptor. Never enable in a published
# build — it is not public API.
__bench_kernels = []
threads = ["rayon"]

[[bench]]
name = "kernel_tiers"
harness = false
required-features = ["__bench_kernels"]

[[bench]]
name = "tf_bench"
harness = false

[[bench]]
name = "decode_bench"
harness = false

# Heaptrack allocation-profiling harness for the decode-from-bytes path.
# Decode is in the default feature set; no extra features needed.
[[example]]
name = "heaptrack_decode"

[lints]
workspace = true
