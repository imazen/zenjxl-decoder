[package]
name = "zenjxl-decoder-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rayon = "1.12.0"

[dependencies.zenjxl-decoder]
path = "../zenjxl-decoder"
default-features = false
# `threads` for the decode_parallel target; the other targets set
# `parallel = false` (decode_with_limits) or use the convenience API, whose
# default `parallel = true` now also runs on the rayon pool.
#
# `all-simd` because without it the fuzzers only ever exercised the scalar
# tier, and every tier is a separate hand-written implementation. That is
# structurally why the avx512 negative-sample inversion and the squeeze
# inverse's SIMD/scalar split were unreachable here: the code carrying them was
# not compiled into the fuzz binary at all. The tiers are selected at runtime,
# so a fuzzing host exercises whatever it supports — which on the x86 CI
# runners is the avx/avx512 path, not scalar.
features = ["threads", "all-simd"]

# Prevent this from interfering with workspace resolution
[workspace]
members = ["."]

[profile.release]
debug = true
opt-level = 3

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
doc = false

[[bin]]
name = "probe"
path = "fuzz_targets/probe.rs"
doc = false

[[bin]]
name = "decode_with_limits"
path = "fuzz_targets/decode_with_limits.rs"
doc = false

[[bin]]
name = "decode_parallel"
path = "fuzz_targets/decode_parallel.rs"
doc = false
